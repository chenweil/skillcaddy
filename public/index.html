<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkillCaddy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/enabled.css">
    <link rel="stylesheet" href="/claude.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>SkillCaddy</span>
        </div>
        <div class="topbar-actions">
          <label class="topbar-toggle" title="在已启用面板和库操作里显示或隐藏 Hermes 段">
            <input id="hermesToggle" type="checkbox" data-focus-key="hermes-toggle" aria-describedby="hermesToggleLabel">
            <span class="topbar-toggle-track" aria-hidden="true"></span>
            <span id="hermesToggleLabel" class="topbar-toggle-label">Hermes</span>
          </label>
          <span id="versionTag" class="version" aria-label="版本号"></span>
          <button id="refreshButton" class="icon-button" data-focus-key="refresh" title="刷新" aria-label="刷新">↻</button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <h1>把本地 skills 像产品资产一样管理。</h1>
          <p class="lede">集中整理 official、github、personal 与 archived 来源，再把需要的 skill 安全启用到当前项目和 Claude Code。</p>
        </div>
        <div class="product-surface" aria-label="当前库状态">
          <div class="surface-header">
            <span></span>
            <span></span>
            <span></span>
            <strong>skillcaddy/state</strong>
          </div>
          <div class="surface-grid">
            <div>
              <span>Skill 原件</span>
              <strong id="heroTotalSkills">0</strong>
            </div>
            <div>
              <span>Agents 启用</span>
              <strong id="heroAgentsCount">0</strong>
            </div>
            <div>
              <span>Claude Code 启用</span>
              <strong id="heroClaudeCount">0</strong>
            </div>
          </div>
          <p id="activeProject" class="surface-path">等待读取项目路径</p>
        </div>
      </section>

      <form class="controls" id="controlsForm">
        <label>
          <span>目标项目路径</span>
          <small class="field-hint">输入项目路径后点「添加项目」保存到下方历史，回车直接读取</small>
          <input id="projectPath" type="text" data-focus-key="project-path" spellcheck="false" placeholder="/Users/your-name/projects/my-app">
        </label>
        <button id="addProject" class="secondary" type="button" data-focus-key="add-project" title="仅把路径存入下方历史，不读取">添加项目</button>
        <button id="loadProject" type="submit" data-focus-key="load-project" title="读取该项目的启用状态（回车同效）">读取项目</button>
        <div id="projectHistory" class="project-history" aria-label="历史项目"></div>
      </form>

      <section class="workspace">
        <aside class="panel">
          <div class="panel-title">
            <div>
              <h2>已启用</h2>
            </div>
            <span>当前项目</span>
          </div>
          <div class="enabled-grid">
            <section class="enabled-column">
              <div class="column-title">
                <span class="column-title-label">.agents/skills <span id="agentsCount" class="count">0</span></span>
                <button id="disableAgents" class="danger column-title-action" data-focus-key="agents-clear" data-focus-fallback-key="skill-search" title="一键清空 .agents/skills（数量见上方计数）" aria-label="一键清空 .agents/skills">清空</button>
              </div>
              <div id="enabledList" class="list compact"></div>
            </section>
            <section class="enabled-column">
              <div class="column-title">
                <span class="column-title-label">Claude Code <span id="claudeCount" class="count">0</span></span>
                <div class="column-title-actions">
                  <button id="syncClaude" data-focus-key="claude-sync" title="把项目已启用的 skill 同步到 Claude Code">同步</button>
                  <button id="unlinkClaude" class="danger column-title-action" data-focus-key="claude-clear" data-focus-fallback-key="claude-sync" title="一键清空 Claude Code（数量见上方计数）" aria-label="一键清空 Claude Code">清空</button>
                </div>
              </div>
              <div id="claudeSkillList" class="list compact"></div>
            </section>
            <section class="enabled-column">
              <div class="column-title">
                <span class="column-title-label">全局 .agents/skills <span id="globalCount" class="count">0</span></span>
                <button id="disableGlobal" class="danger column-title-action" data-focus-key="global-clear" data-focus-fallback-key="skill-search" title="一键清空全局 .agents/skills（数量见上方计数）" aria-label="一键清空全局 .agents/skills">清空</button>
              </div>
              <div id="globalList" class="list compact"></div>
            </section>
            <section class="enabled-column hermes-column" data-hermes-section>
              <div class="column-title">
                <span class="column-title-label">Hermes <span class="column-title-path">~/.hermes/skills</span> <span id="hermesCount" class="count">0</span></span>
                <button id="disableHermes" class="danger column-title-action" data-focus-key="hermes-clear" data-focus-fallback-key="skill-search" title="一键清空 Hermes ~/.hermes/skills（数量见上方计数）" aria-label="一键清空 Hermes ~/.hermes/skills">清空</button>
              </div>
              <div id="hermesList" class="list compact"></div>
            </section>
          </div>
        </aside>

        <section class="panel library-panel">
          <div class="panel-title">
            <div>
              <h2>Skill 原件库 <strong id="totalSkills" class="count">0</strong></h2>
            </div>
            <div class="library-title-actions">
              <div class="advice-popover-anchor">
                <button id="adviceToggle" class="advice-toggle" type="button" data-focus-key="advice-toggle" hidden aria-expanded="false" aria-controls="adviceList" title="查看提示">
                  <svg class="advice-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="8" r="6.5" />
                    <line x1="8" y1="7" x2="8" y2="11.5" />
                    <circle cx="8" cy="4.5" r="0.6" fill="currentColor" stroke="none" />
                  </svg>
                  <span id="adviceCount" class="count">0</span>
                </button>
                <section id="adviceList" class="advice-list advice-popover" hidden role="dialog" aria-label="提示列表"></section>
              </div>
              <select id="sourceFilter" data-focus-key="source-filter" title="来源过滤">
                <option value="">全部来源</option>
                <option value="local">local</option>
                <option value="official">official</option>
                <option value="github">github</option>
                <option value="personal">personal</option>
                <option value="archived">archived</option>
              </select>
            </div>
          </div>
          <div class="library-search">
            <input id="skillSearch" type="text" data-focus-key="skill-search" placeholder="搜索名称、描述或标签…（/ 聚焦，Esc 清除）" aria-label="搜索 skills" aria-keyshortcuts="/">
          </div>
          <!-- advice 已搬到右上角 popover；主工作流（搜索 → 标签 → 库）保持线性。 -->
          <nav id="tagTabs" class="tag-tabs" aria-label="Skill 标签过滤"></nav>
          <div id="skillList" class="list"></div>
        </section>
      </section>

      <div class="message-region">
        <p id="message" class="message" role="status"></p>
        <p id="errorMessage" class="message is-error" role="alert"></p>
      </div>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
