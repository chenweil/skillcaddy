<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkillCaddy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/enabled.css">
    <link rel="stylesheet" href="/claude.css">
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>SkillCaddy</span>
        </div>
        <div class="topbar-actions">
          <span id="versionTag" class="version" aria-label="版本号"></span>
          <button id="refreshButton" class="icon-button" data-focus-key="refresh" title="刷新" aria-label="刷新">↻</button>
        </div>
      </nav>

      <section class="hero">
        <div class="hero-copy">
          <h1>把本地 skills 像产品资产一样管理。</h1>
          <p class="lede">集中整理 official、github、personal 与 archived 来源，再把需要的 skill 安全启用到当前项目和 Claude Code。</p>
        </div>
        <div class="product-surface" aria-label="当前库状态">
          <div class="surface-header">
            <span></span>
            <span></span>
            <span></span>
            <strong>skillcaddy/state</strong>
          </div>
          <div class="surface-grid">
            <div>
              <span>Skill 原件</span>
              <strong id="heroTotalSkills">0</strong>
            </div>
            <div>
              <span>Agents 启用</span>
              <strong id="heroAgentsCount">0</strong>
            </div>
            <div>
              <span>Claude Code 启用</span>
              <strong id="heroClaudeCount">0</strong>
            </div>
          </div>
          <p id="activeProject" class="surface-path">等待读取项目路径</p>
        </div>
      </section>

      <form class="controls" id="controlsForm">
        <label>
          <span>目标项目路径</span>
          <small class="field-hint">输入项目路径后点「添加项目」保存到下方历史，回车直接读取</small>
          <input id="projectPath" type="text" data-focus-key="project-path" spellcheck="false" placeholder="/Users/your-name/projects/my-app">
        </label>
        <button id="addProject" class="secondary" type="button" data-focus-key="add-project" title="仅把路径存入下方历史，不读取">添加项目</button>
        <button id="loadProject" type="submit" data-focus-key="load-project" title="读取该项目的启用状态（回车同效）">读取项目</button>
        <div id="projectHistory" class="project-history" aria-label="历史项目"></div>
      </form>

      <section class="workspace">
        <aside class="panel">
          <div class="panel-title">
            <div>
              <h2>已启用</h2>
            </div>
            <span>当前项目</span>
          </div>
          <div class="enabled-grid">
            <section class="enabled-column">
              <div class="column-title">
                <span>.agents/skills <span id="agentsCount" class="count">0</span></span>
                <button id="disableAgents" class="danger" data-focus-key="agents-clear" data-focus-fallback-key="skill-search" title="一键清空 .agents/skills（数量见上方计数）" aria-label="一键清空 .agents/skills">清空</button>
              </div>
              <div id="enabledList" class="list compact"></div>
            </section>
            <section class="enabled-column">
              <div class="column-title">
                <span>Claude Code <span id="claudeCount" class="count">0</span></span>
                <div class="actions">
                  <button id="syncClaude" data-focus-key="claude-sync" title="把项目已启用的 skill 同步到 Claude Code">同步</button>
                  <button id="unlinkClaude" class="danger" data-focus-key="claude-clear" data-focus-fallback-key="claude-sync" title="一键清空 Claude Code（数量见上方计数）" aria-label="一键清空 Claude Code">清空</button>
                </div>
              </div>
              <section id="claudeSkillList" class="claude-list"></section>
            </section>
          </div>
          <section class="enabled-column global-enabled">
            <div class="column-title">
              <span>全局 .agents/skills <span id="globalCount" class="count">0</span></span>
              <button id="disableGlobal" class="danger" data-focus-key="global-clear" data-focus-fallback-key="skill-search" title="一键清空全局 .agents/skills（数量见上方计数）" aria-label="一键清空全局 .agents/skills">清空</button>
            </div>
            <div id="globalList" class="list compact"></div>
          </section>
        </aside>

        <section class="panel">
          <div class="panel-title">
            <div>
              <h2>Skill 原件库 <strong id="totalSkills" class="count">0</strong></h2>
            </div>
            <select id="sourceFilter" data-focus-key="source-filter" title="来源过滤">
              <option value="">全部来源</option>
              <option value="local">local</option>
              <option value="official">official</option>
              <option value="github">github</option>
              <option value="personal">personal</option>
              <option value="archived">archived</option>
            </select>
          </div>
          <div class="library-search">
            <input id="skillSearch" type="text" data-focus-key="skill-search" placeholder="搜索名称、描述或标签…（/ 聚焦，Esc 清除）" aria-label="搜索 skills" aria-keyshortcuts="/">
          </div>
          <!-- advice 是诊断信息，放在检索入口之后：此前插在搜索框上方，把主工作流
               「过滤 → 找 → 启用」的入口往下推。 -->
          <section id="adviceList" class="advice-list"></section>
          <nav id="tagTabs" class="tag-tabs" aria-label="Skill 标签过滤"></nav>
          <div id="skillList" class="list"></div>
        </section>
      </section>

      <div class="message-region">
        <p id="message" class="message" role="status"></p>
        <p id="errorMessage" class="message is-error" role="alert"></p>
      </div>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
